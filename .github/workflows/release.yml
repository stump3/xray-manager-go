name: Build & Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # 🔥 ВАЖНО — добавили это
      - name: Fix dependencies
        run: |
          go mod tidy

      - name: Build binary
        run: |
          GOOS=linux GOARCH=amd64 go build -o xray-manager

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: xray-manager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
